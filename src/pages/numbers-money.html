<section id="section-numbers" style="display: none">
    <div class="card">
      <h5>Options</h5>
      <div class="layout-options mb-1">
        <div>
          <p class="small">From</p>
          <div class="input-group me-1">
            <div class="input-group-prepend">
              <span class="input-group-text">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#e3e3e3" viewBox="0 0 256 256"><path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"></path></svg>
              </span>
            </div>
            <input class="form-control" id="numberFrom" type="number" min="0" value="0" onchange="generate()" />
          </div>
        </div>

        <div class="ms-1">
          <p class="small">To</p>
          <div class="input-group">
            <div class="input-group-prepend">
              <span class="input-group-text">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#e3e3e3" viewBox="0 0 256 256"><path d="M189.66,122.34a8,8,0,0,1,0,11.32l-72,72a8,8,0,0,1-11.32-11.32L164.69,136H32a8,8,0,0,1,0-16H164.69L106.34,61.66a8,8,0,0,1,11.32-11.32ZM216,32a8,8,0,0,0-8,8V216a8,8,0,0,0,16,0V40A8,8,0,0,0,216,32Z"></path></svg>
              </span>
            </div>
            <input class="form-control" id="numberTo" type="number" min="0" value="50" onchange="generate()" />
          </div>
        </div>
      </div>

      <div class="form-check form-switch layout-options">
        <p class="small m-0">Decimals</p>
        <input class="form-check-input" type="checkbox" role="switch" id="numberRangeDecimals" checked />
      </div>
    </div>
  </section>

<section id="section-money" style="display: none">
    <div class="card">
      <h5>Options</h5>
      <div class="layout-options mb-1">
        <div class="me-1">
          <p class="small">From</p>
          <div class="input-group">
            <div class="input-group-prepend">
              <span class="input-group-text">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#e3e3e3" viewBox="0 0 256 256"><path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"></path></svg>
              </span>
            </div>
            <input class="form-control" id="moneyFrom" type="number" min="0" value="0" onchange="generate()" />
          </div>
        </div>

        <div>
          <p class="small">To</p>
          <div class="input-group">
            <div class="input-group-prepend">
              <span class="input-group-text">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#e3e3e3" viewBox="0 0 256 256"><path d="M189.66,122.34a8,8,0,0,1,0,11.32l-72,72a8,8,0,0,1-11.32-11.32L164.69,136H32a8,8,0,0,1,0-16H164.69L106.34,61.66a8,8,0,0,1,11.32-11.32ZM216,32a8,8,0,0,0-8,8V216a8,8,0,0,0,16,0V40A8,8,0,0,0,216,32Z"></path></svg>
              </span>
            </div>
            <input class="form-control" id="moneyTo" type="number" min="0" value="50" onchange="generate()" />
          </div>
        </div>
      </div>

      <div class="layout-options">
        <div class="w-100" style="margin-right: 4px">
          <p class="small">Symbol</p>
          <div class="input-group">
            <div class="input-group-prepend">
              <span class="input-group-text">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#e3e3e3" viewBox="0 0 256 256"><path d="M172,76a44,44,0,1,0-44,44A44.05,44.05,0,0,0,172,76Zm-44,28a28,28,0,1,1,28-28A28,28,0,0,1,128,104Zm60,24a44,44,0,1,0,44,44A44.05,44.05,0,0,0,188,128Zm0,72a28,28,0,1,1,28-28A28,28,0,0,1,188,200ZM68,128a44,44,0,1,0,44,44A44.05,44.05,0,0,0,68,128Zm0,72a28,28,0,1,1,28-28A28,28,0,0,1,68,200Z"></path></svg>
              </span>
            </div>
            <input class="form-control" id="moneyCurrency" type="text" value="$" onchange="generate()" />
          </div>
        </div>

        <div class="w-100">
          <p class="small">Symbol position</p>
          <div class="input-group">
            <label for="symbol-prepend">
              <input class="btn-radio" type="radio" id="symbol-prepend" name="symbol-position" value="prepend" checked onchange="generate()" />
              <img class="btn" src="https://raw.githubusercontent.com/monzanifabio/figma-mockreate/main/img/prepend.svg" alt="" width="20" height="20" />
            </label>
            <label for="symbol-append">
              <input class="btn-radio" type="radio" id="symbol-append" name="symbol-position" value="append" onchange="generate()" />
              <img class="btn" src="https://raw.githubusercontent.com/monzanifabio/figma-mockreate/main/img/append.svg" alt="" width="20" height="20" />
            </label>
          </div>
        </div>
      </div>
    </div>
  </section>
