<section id="section-datetime" style="display: none">
    <div class="card">
      <h5>Options</h5>

      <div class="layout-options gap-8">
        <div class="w-50">
          <p class="small">Year</p>
          <div class="input-group mb-1">
            <div class="input-group-prepend">
              <span class="input-group-text">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#e3e3e3" viewBox="0 0 256 256">
                  <path d="M208,32H184V24a8,8,0,0,0-16,0v8H88V24a8,8,0,0,0-16,0v8H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32ZM72,48v8a8,8,0,0,0,16,0V48h80v8a8,8,0,0,0,16,0V48h24V80H48V48ZM208,208H48V96H208V208Zm-68-76a12,12,0,1,1-12-12A12,12,0,0,1,140,132Zm44,0a12,12,0,1,1-12-12A12,12,0,0,1,184,132ZM96,172a12,12,0,1,1-12-12A12,12,0,0,1,96,172Zm44,0a12,12,0,1,1-12-12A12,12,0,0,1,140,172Zm44,0a12,12,0,1,1-12-12A12,12,0,0,1,184,172Z"></path>
                </svg>
              </span>
            </div>
            <input class="form-control" id="datetimeYear" type="number" min="1900" max="2099" step="1" value="2024" onchange="generate()" />
          </div>
        </div>
        <div class="w-100">
          <p class="small">Date format</p>
          <div class="input-group mb-1">
            <div class="input-group-prepend">
              <span class="input-group-text">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#e3e3e3" viewBox="0 0 256 256">
                  <path d="M208,32H184V24a8,8,0,0,0-16,0v8H88V24a8,8,0,0,0-16,0v8H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32ZM72,48v8a8,8,0,0,0,16,0V48h80v8a8,8,0,0,0,16,0V48h24V80H48V48ZM208,208H48V96H208V208Zm-68-76a12,12,0,1,1-12-12A12,12,0,0,1,140,132Zm44,0a12,12,0,1,1-12-12A12,12,0,0,1,184,132ZM96,172a12,12,0,1,1-12-12A12,12,0,0,1,96,172Zm44,0a12,12,0,1,1-12-12A12,12,0,0,1,140,172Zm44,0a12,12,0,1,1-12-12A12,12,0,0,1,184,172Z"></path>
                </svg>
              </span>
            </div>
            <select class="form-control" id="dateDatetimeFormat" onchange="generate()">
              <option value="0" disabled>Date format</option>
              <option value="1" selected>26/08/1988</option>
              <option value="2">26-08-1988</option>
              <option value="3">26 08 1988</option>
              <option value="4">26 Aug 1988</option>
            </select>
          </div>
        </div>
      </div>
      <div class="layout-options gap-8">
        <div class="w-50">
          <p class="small">Separator</p>
          <div class="input-group mb-1">
            <div class="input-group-prepend">
              <span class="input-group-text">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#e3e3e3" viewBox="0 0 256 256"><path d="M112,48V208a8,8,0,0,1-16,0V136H43.31l18.35,18.34a8,8,0,0,1-11.32,11.32l-32-32a8,8,0,0,1,0-11.32l32-32a8,8,0,0,1,11.32,11.32L43.31,120H96V48a8,8,0,0,1,16,0Zm125.66,74.34-32-32a8,8,0,0,0-11.32,11.32L212.69,120H160V48a8,8,0,0,0-16,0V208a8,8,0,0,0,16,0V136h52.69l-18.35,18.34a8,8,0,0,0,11.32,11.32l32-32A8,8,0,0,0,237.66,122.34Z"></path></svg>
              </span>
            </div>
            <input class="form-control" id="datetimeSeparator" type="text" value=" - " onchange="generate()" />
          </div>
        </div>

        <div class="w-100">
          <p class="small">Time format</p>
          <div class="input-group">
            <div class="input-group-prepend">
              <span class="input-group-text">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#e3e3e3" viewBox="0 0 256 256"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm64-88a8,8,0,0,1-8,8H128a8,8,0,0,1-8-8V72a8,8,0,0,1,16,0v48h48A8,8,0,0,1,192,128Z"></path></svg>
              </span>
            </div>
            <select class="form-control" id="timeDatetimeFormat" onchange="generate()">
              <option value="0" disabled>Select time format</option>
              <option value="1" selected>24h - hh:mm - 15:30</option>
              <option value="2">12h - h:mm am/pm - 4:30pm</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </section>
