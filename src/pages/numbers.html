<section id="section-numbers" style="display: none">
    <div class="card">
      <h5>Options</h5>
      <div class="layout-options mb-1">
        <div>
          <p class="small">From</p>
          <div class="input-group me-1">
            <div class="input-group-prepend">
              <span class="input-group-text">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#e3e3e3" viewBox="0 0 256 256"><path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"></path></svg>
              </span>
            </div>
            <input class="form-control" id="numberFrom" type="number" min="0" value="0" onchange="generate()" />
          </div>
        </div>

        <div class="ms-1">
          <p class="small">To</p>
          <div class="input-group">
            <div class="input-group-prepend">
              <span class="input-group-text">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#e3e3e3" viewBox="0 0 256 256"><path d="M189.66,122.34a8,8,0,0,1,0,11.32l-72,72a8,8,0,0,1-11.32-11.32L164.69,136H32a8,8,0,0,1,0-16H164.69L106.34,61.66a8,8,0,0,1,11.32-11.32ZM216,32a8,8,0,0,0-8,8V216a8,8,0,0,0,16,0V40A8,8,0,0,0,216,32Z"></path></svg>
              </span>
            </div>
            <input class="form-control" id="numberTo" type="number" min="0" value="50" onchange="generate()" />
          </div>
        </div>
      </div>

      <div class="form-check form-switch layout-options">
        <p class="small m-0">Decimals</p>
        <input class="form-check-input" type="checkbox" role="switch" id="numberRangeDecimals" checked />
      </div>
    </div>
  </section>
